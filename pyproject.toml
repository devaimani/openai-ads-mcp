[project]
name = "openai-ads-mcp"
version = "0.1.0"
description = "MCP server for the OpenAI Ads Advertiser API, with retries, response budgeting and postcode-level location lookup"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "openai-ads", "chatgpt-ads", "advertising"]

dependencies = [
    "mcp[cli]>=1.26,<2",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.scripts]
openai-ads-mcp = "openai_ads_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_ads_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
